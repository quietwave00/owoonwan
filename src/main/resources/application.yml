spring:
  application:
    name: owoonwan
  profiles:
    default: local

server:
  address: 0.0.0.0
  port: ${PORT:8080}

app:
  firebase:
    enabled: true
    credentials: ${FIREBASE_SERVICE_ACCOUNT_JSON:${GOOGLE_APPLICATION_CREDENTIALS:}}

---
spring:
  config:
    activate:
      on-profile: local

app:
  firebase:
    enabled: true
  cors:
    allowed-origin-patterns: http://localhost:5173,http://127.0.0.1:5173

---
spring:
  config:
    activate:
      on-profile: prod
  main:
    lazy-initialization: true

app:
  firebase:
    enabled: true
  cors:
    allowed-origin-patterns: https://owoonwan.fly.dev
