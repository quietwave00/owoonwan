app = "owoonwan"
primary_region = "nrt"

[build]
dockerfile = "Dockerfile"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 80
min_machines_running = 0
processes = [ "app" ]

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
path = "/"
timeout = "5s"